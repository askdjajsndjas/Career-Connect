<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>

    <radialGradient id="vGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="playBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.5"/>
    </filter>

    <pattern id="vGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="450" rx="14" fill="url(#vGrad)"/>
  <rect width="800" height="450" rx="14" fill="url(#vGrid)"/>
  <rect width="800" height="450" rx="14" fill="url(#vGlow)"/>
  <rect width="800" height="450" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top bar -->
  <g transform="translate(40, 36)">
    <rect width="125" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="0.75"/>
    <circle cx="13" cy="13" r="4" fill="#10B981"/>
    <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">4K / 1080P HD</text>

    <rect x="135" width="135" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>
    <text x="147" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">DURATION: 02:57</text>
  </g>

  <!-- Centered Play Button -->
  <g transform="translate(400, 205)" filter="url(#playShadow)">
    <circle cx="0" cy="0" r="46" fill="url(#playBtnGrad)"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#FFFFFF"/>
  </g>

  <!-- Video Title & Details -->
  <text x="400" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">
    Career Connect &bull; Official System Demonstration
  </text>
  <text x="400" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">
    Full End-to-End Walkthrough &bull; South African English Narration (en-ZA)
  </text>

  <!-- Bottom notice -->
  <g transform="translate(400, 385)">
    <rect x="-240" y="-18" width="480" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#38BDF8">
      Repository Master: demo_career_connect_female_narrated.mp4 (7.49 MB)
    </text>
  </g>
</svg>
