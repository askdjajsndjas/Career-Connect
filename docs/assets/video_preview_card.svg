<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="auto">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>

    <radialGradient id="vGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.36"/>
      <stop offset="65%" stop-color="#0B132B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040710" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="playBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="playShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.55"/>
    </filter>

    <pattern id="vGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Outer Cinema Frame -->
  <rect width="880" height="480" rx="14" fill="url(#vGrad)"/>
  <rect width="880" height="480" rx="14" fill="url(#vGrid)"/>
  <rect width="880" height="480" rx="14" fill="url(#vGlow)"/>
  <rect width="880" height="480" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="0" y="0" width="880" height="3" fill="#38BDF8"/>

  <!-- Top Editorial Metadata Strip -->
  <g transform="translate(36, 32)">
    <rect width="142" height="26" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#F8FAFC">1920x1080 &bull; 30 FPS</text>

    <rect x="152" width="136" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="0.9"/>
    <text x="220" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#BAE6FD">RUNTIME // 02:57</text>

    <rect x="298" width="194" height="26" rx="5" fill="#0F172A" stroke="#334155" stroke-width="0.9"/>
    <text x="395" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#94A3B8">VOICE // en-ZA NEURAL</text>

    <text x="808" y="17" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">7 SCENES &bull; 7.49 MB</text>
  </g>

  <!-- Subtle Timeline Chapters Preview Strip -->
  <g transform="translate(64, 92)">
    <line x1="0" y1="0" x2="752" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">00:00 AUTH</text>
    <text x="115" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">00:18 SA FEED</text>
    <text x="240" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">00:46 REMOTIVE</text>
    <text x="375" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">01:12 APPLY</text>
    <text x="485" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">01:30 TRACKER</text>
    <text x="605" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">01:58 AES-256 CV</text>
    <text x="752" y="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#64748B">02:40 LOGOUT</text>
  </g>

  <!-- Centered Play Button with Concentric Rings -->
  <g transform="translate(440, 224)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.45"/>
    <circle cx="0" cy="0" r="46" fill="url(#playBtnGrad)" filter="url(#playShadow)"/>
    <polygon points="-11,-19 23,0 -11,19" fill="#F8FAFC"/>
  </g>

  <!-- Title & Editorial Subtitle -->
  <text x="440" y="332" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.5" fill="#F8FAFC">
    WATCH NARRATED SYSTEM DEMONSTRATION
  </text>
  <text x="440" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#BAE6FD">
    Click to open or download the full 02:57 South African English (en-ZA) narrated walkthrough MP4
  </text>

  <!-- Bottom Action Pill -->
  <g transform="translate(440, 414)">
    <rect x="-295" y="-20" width="590" height="40" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">
      ▶ demo_career_connect_female_narrated.mp4 &bull; H.264 + AAC 48 kHz &bull; 7,852,454 BYTES
    </text>
  </g>
</svg>
