<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto">
  <defs>
    <!-- Deep Midnight Navy Editorial Canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040710"/>
      <stop offset="55%" stop-color="#091124"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Electric & Cobalt Lighting -->
    <radialGradient id="cobaltGlow" cx="18%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#0B132B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040710" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="powderGlow" cx="88%" cy="72%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#091124" stop-opacity="0"/>
    </radialGradient>

    <!-- Editorial Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="62%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090F1E" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Precision Blueprint Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Canvas & Atmospheric Lighting -->
  <rect width="1200" height="480" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="480" rx="14" fill="url(#cobaltGlow)"/>
  <rect width="1200" height="480" rx="14" fill="url(#powderGlow)"/>
  <rect width="1200" height="480" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Electric Cobalt Trim -->
  <rect x="0" y="0" width="1200" height="3.5" fill="url(#accentLine)"/>

  <!-- Oversized Editorial Background Watermark (Asymmetric Right) -->
  <text x="1150" y="245" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="172" font-weight="900" letter-spacing="-8" fill="#38BDF8" fill-opacity="0.035">
    ZA // 26
  </text>

  <!-- Editorial Top Metadata Strip -->
  <g transform="translate(72, 54)">
    <rect x="0" y="-15" width="96" height="22" rx="4" fill="#0284C7" fill-opacity="0.22" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="48" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#BAE6FD">ISSUE 01 // ZA</text>
    <text x="112" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.5" fill="#64748B">
