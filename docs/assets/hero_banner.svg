  <!-- Powder Blue Editorial Deck -->
  <text x="72" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#BAE6FD">
    South African student-career discovery, real-time application tracking &amp; hardware-encrypted CVs.
  </text>

  <text x="72" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
