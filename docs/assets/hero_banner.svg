    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38BDF8">02 // REAL-TIME TRACKING</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Firestore Snapshot Sync</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Deterministic IDs &amp; 14-day auto-archive</text>
  </g>

  <g transform="translate(604, 328)">
    <rect width="248" height="86" rx="8" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38BDF8">03 // DEVICE PRIVACY</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">AndroidKeyStore AES-GCM</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">256-bit key + 128-bit GCM auth tag</text>
  </g>

  <g transform="translate(870, 328)">
    <rect width="258" height="86" rx="8" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38BDF8">04 // NARRATED SHOWCASE</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">02:57 HD Walkthrough (en-ZA)</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">7 scenes &bull; H.264 + AAC 48 kHz</text>
  </g>

  <!-- Footer Status Bar -->
  <g transform="translate(72, 444)">
    <circle cx="6" cy="0" r="4" fill="#38BDF8"/>
    <text x="18" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8">
      REPOSITORY: github.com/askdjajsndjas/Career-Connect &bull; KOTLIN 2.2.10 &bull; AGP 9.3.2 &bull; FIREBASE BOM 34.7.0 &bull; RETROFIT 2.11.0
    </text>
  </g>
</svg>
