    </text>
    <text x="1056" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8">
      AFRICA-SOUTH1 (JHB)
    </text>
  </g>

  <line x1="72" y1="74" x2="1128" y2="74" stroke="#1E293B" stroke-width="1"/>

  <!-- Asymmetric Left Column: Editorial Headline -->
  <text x="72" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-2.5" fill="url(#titleGrad)">
    CAREER CONNECT
