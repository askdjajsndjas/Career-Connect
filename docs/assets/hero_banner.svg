  </text>
  <text x="72" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
    SA-eligible global remote feeds via Remotive, live Cloud Firestore status listeners, and AndroidKeyStore AES-256-GCM privacy.
  </text>

  <!-- Asymmetric Right Column: Architectural Telemetry Badge -->
  <g transform="translate(868, 108)">
    <rect width="260" height="162" rx="10" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="260" height="3" rx="1.5" fill="#38BDF8"/>
    <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.8" fill="#38BDF8">BUILD TELEMETRY // VERIFIED</text>
    <line x1="20" y1="38" x2="240" y2="38" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#94A3B8">SDK TARGET</text>
    <text x="240" y="60" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#F8FAFC">API 37 (Min 24)</text>
    <text x="20" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#94A3B8">UNIT SUITE</text>
    <text x="240" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">26 / 26 PASSING</text>
    <text x="20" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#94A3B8">CRYPTO CIPHER</text>
    <text x="240" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#BAE6FD">AES-256-GCM</text>
    <text x="20" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#94A3B8">CLOUD REGION</text>
    <text x="240" y="132" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#F8FAFC">africa-south1</text>
  </g>

  <!-- Fine Editorial Divider -->
  <line x1="72" y1="304" x2="1128" y2="304" stroke="url(#accentLine)" stroke-width="1.2"/>

  <!-- 4 Chapter Spec Cards -->
  <g transform="translate(72, 328)">
    <rect width="248" height="86" rx="8" fill="url(#cardSurface)" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38BDF8">01 // LOCALIZED DISCOVERY</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">6 SA Academic Pathways</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">14 SA-focused listings + Remotive API</text>
  </g>

  <g transform="translate(338, 328)">
